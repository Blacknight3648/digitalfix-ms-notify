version: '3.8'

networks:
  digitalfix-net:
    name: digitalfix-net
    driver: bridge

services:

  # Microservicio de Notificaciones y Despacho (ms-digitalfix-notify)
  # Sin RabbitMQ: ms-admin-queues consume las colas y entrega cada mensaje en
  # /internal/v1/notificaciones/* (debe correr en la misma red digitalfix-net).
  ms-digitalfix-notify:
    build:
      context: ./ms.notify
      dockerfile: Dockerfile
    container_name: ms-digitalfix-notify
    ports:
      - "${PORT:-8083}:8083"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8083}
      - SERVER_PORT=${SERVER_PORT:-8083}
      # Servidor SMTP (JavaMailSender)
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      - JAVA_OPTS=-Djava.net.preferIPv4Stack=true
    networks:
      - digitalfix-net
    restart: unless-stopped
