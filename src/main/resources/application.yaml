# Puerto local configurable desde .env (PORT o SERVER_PORT)
server:
  port: ${PORT:${SERVER_PORT:8083}}

spring:
  application:
    name: ms-digitalfix-notify

  # Carga el archivo .env de la raiz del proyecto o subcarpetas
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../digitalfix-infrastructure/.env[.properties]
      - optional:file:digitalfix-infrastructure/.env[.properties]
      - optional:file:../.env[.properties]

  # Sin base de datos (caso, sección 5: ms-digitalfix-notify "sin DB") y sin conexión a RabbitMQ:
  # ms-admin-queues consume las colas y entrega cada mensaje en /internal/v1/notificaciones/*.
  # Este servicio solo contiene la lógica de negocio (correo, despacho, informe).

  # -------------------------------------------------------------------
  # Configuración del Servidor SMTP (Java Mail Sender)
  # -------------------------------------------------------------------
  mail:
    host: ${SPRING_MAIL_HOST:smtp.mailtrap.io}
    port: ${SPRING_MAIL_PORT:2525}
    username: ${SPRING_MAIL_USERNAME:tu_usuario_smtp}
    password: ${SPRING_MAIL_PASSWORD:tu_password_smtp}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# -------------------------------------------------------------------
# Configuración de SpringDoc / Swagger
# -------------------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

# -------------------------------------------------------------------
# Configuración de Spring Boot Actuator (Monitoreo y Salud)
# -------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    mail:
      enabled: false
